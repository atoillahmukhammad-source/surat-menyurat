<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Surat Menyurat AI</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

  <div class="max-w-6xl mx-auto p-4 md:p-8">

    <div class="mb-6">
      <h1 class="text-3xl font-bold text-slate-900">
        📄 Surat Menyurat AI
      </h1>

      <p class="text-slate-500 mt-1">
        Buat surat profesional dengan bantuan Gemini AI
      </p>
    </div>

    <div class="grid lg:grid-cols-2 gap-6">

      <!-- FORM -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border">

        <h2 class="text-lg font-semibold mb-5">
          Data Surat
        </h2>

        <label class="block text-sm font-medium mb-1">
          Jenis Surat
        </label>

        <select
          id="jenis"
          class="w-full border rounded-lg p-3 mb-4"
        >
          <option>Surat Lamaran Kerja</option>
          <option>Surat Izin Kerja</option>
          <option>Surat Pengunduran Diri</option>
          <option>Surat Permohonan</option>
          <option>Surat Undangan</option>
          <option>Surat Tugas</option>
          <option>Surat Keterangan</option>
          <option>Surat Dinas</option>
        </select>


        <label class="block text-sm font-medium mb-1">
          Nama Pengirim
        </label>

        <input
          id="nama"
          type="text"
          placeholder="Contoh: Samsul Hadi"
          class="w-full border rounded-lg p-3 mb-4"
        />


        <label class="block text-sm font-medium mb-1">
          Penerima / Instansi
        </label>

        <input
          id="penerima"
          type="text"
          placeholder="Contoh: PT Berkah Indonesia"
          class="w-full border rounded-lg p-3 mb-4"
        />


        <label class="block text-sm font-medium mb-1">
          Detail / Pokok Surat
        </label>

        <textarea
          id="detail"
          rows="8"
          placeholder="Jelaskan kebutuhan surat. Contoh: Saya ingin melamar posisi analis kebijakan dan memiliki pengalaman 5 tahun..."
          class="w-full border rounded-lg p-3 mb-4"
        ></textarea>


        <button
          id="generateBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-medium py-3 rounded-lg transition"
        >
          ✨ Buat Surat dengan AI
        </button>

      </div>


      <!-- HASIL -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border">

        <div class="flex items-center justify-between mb-5">

          <h2 class="text-lg font-semibold">
            Hasil Surat
          </h2>

          <button
            id="copyBtn"
            class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg"
          >
            Salin
          </button>

        </div>

        <div
          id="status"
          class="hidden mb-4 p-3 rounded-lg text-sm"
        ></div>

        <pre
          id="output"
          class="whitespace-pre-wrap font-sans leading-7 min-h-[500px] text-slate-800"
        >Hasil surat akan muncul di sini...</pre>

      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
