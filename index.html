<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Menyurat AI</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<div class="max-w-5xl mx-auto p-6">

<h1 class="text-3xl font-bold mb-6">
📄 Surat Menyurat AI
</h1>

<div class="grid md:grid-cols-2 gap-6">

<div class="bg-white p-5 rounded-xl shadow">

<select id="jenis"
class="w-full border p-2 mb-3">

<option>Surat Lamaran Kerja</option>
<option>Surat Izin Kerja</option>
<option>Surat Pengunduran Diri</option>

</select>

<input
id="nama"
placeholder="Nama Lengkap"
class="w-full border p-2 mb-3">

<input
id="penerima"
placeholder="Nama Perusahaan / Penerima"
class="w-full border p-2 mb-3">

<textarea
id="detail"
rows="5"
placeholder="Jelaskan kebutuhan surat"
class="w-full border p-2 mb-3"></textarea>

<button
id="generateBtn"
class="w-full bg-blue-600 text-white py-3 rounded">

✨ Buat Surat

</button>

</div>

<div class="bg-white p-5 rounded-xl shadow">

<pre id="output"
class="whitespace-pre-wrap">

Hasil surat akan muncul di sini...

</pre>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
