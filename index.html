<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Surat Menyurat AI</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #suratPreview {
      width: 210mm;
      max-width: 100%;
      min-height: 297mm;
      background: white;
      padding: 20mm 22mm;
      box-sizing: border-box;
    }

    #output {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #111827;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      text-align: justify;
      text-justify: inter-word;
    }

    @page {
      size: A4 portrait;
      margin: 16mm 19mm;
    }

    @media print {
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
      }

      body * {
        visibility: hidden !important;
      }

      #suratPreview,
      #suratPreview * {
        visibility: visible !important;
      }

      #suratPreview {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;

        width: 100% !important;
        max-width: none !important;
        min-height: 0 !important;
        height: auto !important;

        margin: 0 !important;
        padding: 0 !important;

        box-shadow: none !important;
        border: none !important;
        background: white !important;
      }

      #output {
        font-family: Arial, Helvetica, sans-serif !important;
        font-size: 11.5pt !important;
        line-height: 1.5 !important;

        color: black !important;

        margin: 0 !important;
        padding: 0 !important;

        white-space: pre-wrap !important;

        text-align: justify !important;
        text-justify: inter-word !important;
      }

      .no-print,
      #status,
      #printModal {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen">

  <div class="max-w-7xl mx-auto p-4 md:p-8">

    <header class="no-print mb-6">
      <h1 class="text-3xl font-bold text-slate-900">
        📄 Surat Generator
      </h1>

      <p class="text-slate-500 mt-1">
        Buat surat cepat, mudah disesuaikan dan tinggal cetak
      </p>
    </header>

    <div class="grid lg:grid-cols-[380px_1fr] gap-6 items-start">

      <!-- FORM -->
      <section class="no-print bg-white p-6 rounded-2xl shadow-sm border">

        <h2 class="text-lg font-semibold mb-5">
          Data Surat
        </h2>

        <label class="block text-sm font-medium mb-1">
          Jenis Surat
        </label>

        <select
          id="jenis"
          class="w-full border border-slate-300 rounded-lg p-3 mb-4"
        >
          <option>Surat Lamaran Kerja</option>
          <option>Surat Izin Kerja</option>
          <option>Surat Pengunduran Diri</option>
          <option>Surat Permohonan</option>
          <option>Surat Undangan</option>
          <option>Surat Tugas</option>
          <option>Surat Keterangan</option>
          <option>Surat Dinas</option>
        </select>

        <label class="block text-sm font-medium mb-1">
          Nama Pengirim
        </label>

        <input
          id="nama"
          type="text"
          placeholder="Contoh: Samsul Hadi"
          class="w-full border border-slate-300 rounded-lg p-3 mb-4"
        >

        <label class="block text-sm font-medium mb-1">
          Penerima / Instansi
        </label>

        <input
          id="penerima"
          type="text"
          placeholder="Contoh: Pimpinan PT Berkah"
          class="w-full border border-slate-300 rounded-lg p-3 mb-4"
        >

        <label class="block text-sm font-medium mb-1">
          Penjelasan dan Rincian Surat
        </label>

        <textarea
          id="detail"
          rows="9"
          placeholder="Tuliskan informasi penting yang harus dimuat dalam surat..."
          class="w-full border border-slate-300 rounded-lg p-3 mb-4 resize-y"
        ></textarea>

        <button
          id="generateBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-medium py-3 rounded-lg transition"
        >
          ✨ Buat Draft Surat
        </button>

        <div
          id="status"
          class="hidden mt-4 p-3 rounded-lg text-sm"
        ></div>

      </section>


      <!-- HASIL -->
      <section>

        <div class="no-print flex flex-wrap gap-2 mb-4">

          <button
            id="copyBtn"
            class="bg-white border border-slate-300 px-4 py-2 rounded-lg"
          >
            📋 Salin
          </button>

          <button
            id="editBtn"
            class="bg-white border border-slate-300 px-4 py-2 rounded-lg"
          >
            ✏️ Edit
          </button>

          <button
            id="printBtn"
            class="bg-white border border-slate-300 px-4 py-2 rounded-lg"
          >
            🖨️ Cetak
          </button>

          <button
            id="regenerateBtn"
            class="bg-white border border-slate-300 px-4 py-2 rounded-lg"
          >
            🔄 Buat Ulang
          </button>

        </div>

        <div class="overflow-auto pb-6">

          <article
            id="suratPreview"
            class="mx-auto shadow-md"
          >
            <div
              id="output"
              contenteditable="false"
              spellcheck="true"
            >Hasil surat akan muncul di sini...</div>
          </article>

        </div>

      </section>

    </div>

  </div>


  <!-- POPUP CETAK -->
  <div
    id="printModal"
    class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 no-print"
  >
    <div class="bg-white rounded-2xl shadow-xl p-6 w-[340px]">

      <h3 class="text-xl font-semibold mb-2">
        Pilih Format Dokumen
      </h3>

      <p class="text-sm text-slate-500 mb-5">
        Pilih format surat yang ingin dihasilkan.
      </p>

      <div class="space-y-3">

        <button
          id="wordBtn"
          class="w-full border border-blue-200 bg-blue-50 hover:bg-blue-100 rounded-xl p-4 text-left"
        >
          <div class="font-semibold">
            📘 Microsoft Word
          </div>

          <div class="text-xs text-slate-500 mt-1">
            Unduh surat untuk diedit kembali.
          </div>
        </button>

        <button
          id="pdfBtn"
          class="w-full border border-red-200 bg-red-50 hover:bg-red-100 rounded-xl p-4 text-left"
        >
          <div class="font-semibold">
            📕 PDF
          </div>

          <div class="text-xs text-slate-500 mt-1">
            Simpan surat dalam format siap cetak.
          </div>
        </button>

      </div>

      <button
        id="closePrintModal"
        class="w-full mt-5 text-sm text-slate-500 hover:text-slate-800"
      >
        Batal
      </button>

    </div>
  </div>


  <script src="app.js"></script>

</body>
</html>
